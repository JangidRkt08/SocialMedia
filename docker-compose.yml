services:
  db:
    image: postgres:17
    container_name: social-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # networks:
    #   - backend 
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d socialnetwork"]
      interval: 5s
      timeout: 5s
      retries: 5  

volumes:
  db-data: 
